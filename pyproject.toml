[project]
name = "deployez-un-modele-de-ml"
version = "0.1.0"
description = ""
authors = [
    {name = "Christophe Salles",email = "christophe.sallessacareau@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ipykernel (>=7.1.0,<8.0.0)",
    "numpy (>=2.3.5,<3.0.0)",
    "matplotlib (>=3.10.7,<4.0.0)",
    "pandas (>=2.3.3,<3.0.0)",
    "scikit-learn (>=1.7.2,<2.0.0)",
    "seaborn (>=0.13.2,<0.14.0)",
    "scipy (>=1.16.3,<2.0.0)",
    "notebook (>=7.5.0,<8.0.0)",
    "transformers (>=4.57.3,<5.0.0)",
    "gradio (>=6.0.2,<7.0.0)",
    "pytest (>=9.0.2,<10.0.0)"
]

[tool.poetry]
packages = [{include = "deployez_un_modele_de_ml", from = "src"}]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
